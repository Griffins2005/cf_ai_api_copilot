name = "cf-ai-api-copilot"
main = "src/index.ts"
compatibility_date = "2024-11-27"
workers_dev = false
preview_urls = false

[ai]
binding = "AI"

[durable_objects]
bindings = [
  { name = "API_SESSION_DO", class_name = "ApiSessionDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ApiSessionDO"]

[observability]
[observability.logs]
enabled = false
head_sampling_rate = 1
invocation_logs = true
persist = true
